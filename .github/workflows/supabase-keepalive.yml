name: Mantener activo Supabase

on:
  schedule:
    - cron: "0 13 */3 * *"   # cada 3 días, 8:00 hora Ecuador
  workflow_dispatch:          # botón para ejecutarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar una categoría
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/categorias?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
